services:
  kitchenwall:
    build: .
    container_name: kitchenwall
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
    volumes:
      # data.json, backup and secrets.json live here (survives updates/rebuilds)
      - kitchenwall-data:/data

volumes:
  kitchenwall-data:
